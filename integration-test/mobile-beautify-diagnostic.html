<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪头像 · 移动端美化诊断</title>
<style>
  body { margin: 0; padding: 14px; background: #17191f; color: #e8e8e8; font-family: system-ui, "Microsoft YaHei", sans-serif; font-size: 14px; line-height: 1.55; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #a9c7ff; }
  button { background: #2d5f8a; color: #fff; border: 0; border-radius: 6px; padding: 8px 10px; margin: 3px 4px 3px 0; }
  button.warn { background: #8a4a2d; }
  #chat { background: #22252c; border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .mes { margin: 10px 0; }
  .mes .mes_text { line-height: 1.7; font-size: 16px; white-space: pre-wrap; }
  .mes .mes_text p { margin: .4em 0; }
  #report { background: #101216; border: 1px solid #313743; border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-all; font-family: Consolas, monospace; font-size: 12px; max-height: 42vh; overflow: auto; }
  .ok { color: #7ed491; }
  .bad { color: #ff8f8f; }
  .hint { color: #aab; }
</style>
</head>
<body>
<h1>情绪头像 · 移动端美化诊断</h1>
<div class="hint">用途：在没有控制台的移动端/WebView 中判断“脚本没执行”还是“CSS 没生效”。本页不写入数据。</div>
<p>
  <button id="btn-run">生成诊断报告</button>
  <button id="btn-copy">复制报告</button>
  <button id="btn-clear" class="warn">清空报告</button>
</p>
<div id="chat-wrap"><div id="chat"></div></div>
<div id="report">尚未生成。</div>

<script>
window.tavern_events = {
  APP_READY: 'app_ready', CHAT_CHANGED: 'chat_changed',
  CHARACTER_MESSAGE_RENDERED: 'character_message_rendered', USER_MESSAGE_RENDERED: 'user_message_rendered',
  MESSAGE_EDITED: 'message_edited', MESSAGE_SWIPED: 'message_swiped', MESSAGE_RECEIVED: 'message_received',
  GENERATION_STARTED: 'generation_started', GENERATION_ENDED: 'generation_ended', GENERATION_STOPPED: 'generation_stopped',
  MORE_MESSAGES_LOADED: 'more_messages_loaded'
};
window.eventOn = function () {};
window.injectPrompts = function () { return { uninject: function () {} }; };
window.__errors = [];
window.addEventListener('error', function (e) { window.__errors.push(e.message); });
</script>
<script src="../emotion-avatar.js"></script>
<script>
function makeImg(label) {
  var c = document.createElement('canvas'); c.width = 96; c.height = 96;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#446'; ctx.fillRect(0, 0, 96, 96);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 48, 48, 88);
  return c.toDataURL('image/png');
}
function addFloor(html) {
  var mes = document.createElement('div'); mes.className = 'mes';
  var text = document.createElement('div'); text.className = 'mes_text'; text.innerHTML = html;
  mes.appendChild(text); document.getElementById('chat').appendChild(mes);
  return mes;
}
function line(name, ok, value) {
  return (ok ? '✓ ' : '✗ ') + name + '：' + value;
}
function bool(v) { return v ? 'true' : 'false'; }
function snapshot(el, props) {
  if (!el) return '元素不存在';
  var cs = getComputedStyle(el);
  return props.map(function (p) { return p + '=' + cs[p]; }).join('；');
}
function buildReport() {
  var report = [];
  var api = window.EmoAvatar;
  report.push('页面：' + location.href);
  report.push('UA：' + navigator.userAgent);
  report.push('视口：' + innerWidth + '×' + innerHeight + '，devicePixelRatio=' + devicePixelRatio);
  report.push(line('脚本桥存在', !!api, api ? api.version : '未加载'));
  report.push(line('页面错误为 0', window.__errors.length === 0, window.__errors.join(' | ') || '无'));
  report.push(line('样式表已注入', !!document.getElementById('eca-styles'), document.getElementById('eca-styles') ? '#eca-styles' : '缺失'));
  report.push(line('尺寸变量已注入', !!document.getElementById('eca-size-style'), document.getElementById('eca-size-style') ? '#eca-size-style' : '缺失'));

  var root = document.querySelector('.mes_text');
  var img = root && root.querySelector('img.eca-avatar');
  var placeholder = root && root.querySelector('.eca-placeholder');
  var p = img && img.closest('p');
  var text = p && p.querySelector(':scope > .eca-text');
  report.push(line('标签已替换', !!img, img ? 'img.eca-avatar=' + img.dataset.ecaName + '/' + img.dataset.ecaEmotion : '无 img'));
  report.push(line('未生成占位符', !placeholder, placeholder ? '存在占位：' + placeholder.dataset.ecaName + '/' + placeholder.dataset.ecaEmotion : '无占位'));
  report.push(line('段首段落已加 .eca-p', !!(p && p.classList.contains('eca-p')), p ? 'p.class=' + p.className : '无 p'));
  report.push(line('文本已包 .eca-text', !!text, text ? 'data-speaker=' + text.dataset.speaker : '无 .eca-text'));
  report.push('段落计算样式：' + snapshot(p, ['display', 'alignItems', 'gap', 'marginTop', 'marginBottom']));
  report.push('头像计算样式：' + snapshot(img, ['display', 'width', 'height', 'flex', 'objectFit', 'borderRadius', 'boxShadow']));
  report.push('文本计算样式：' + snapshot(text, ['display', 'flex', 'minWidth', 'lineHeight', 'borderLeft', 'paddingLeft', 'opacity']));
  if (api && api.debugStatus) report.push('脚本状态：' + JSON.stringify(api.debugStatus()));
  var verdict = '未知';
  if (!api) verdict = '脚本未执行/未加载：检查酒馆助手脚本是否启用、导入版本与移动端环境';
  else if (window.__errors.length) verdict = '脚本执行报错：优先发回“页面错误”行';
  else if (!document.getElementById('eca-styles')) verdict = '样式未注入：重点检查 topWindow/document 作用域或旧 #eca-styles 幂等早退';
  else if (!img) verdict = '标签未替换：重点检查角色登记、提示词标签、.mes_text 是否被找到';
  else if (placeholder) verdict = '生成了占位头像：角色未登记/缺图/缓存未预热，不是 CSS 问题';
  else if (!p || !p.classList.contains('eca-p') || !text) verdict = '替换成功但结构未两列化：移动端 DOM 不是 p 包裹或 :has() 兜底不生效';
  else if (getComputedStyle(p).display !== 'flex') verdict = '结构正确但 flex 样式未命中：重点检查主题覆盖或样式表所在 document 不一致';
  else verdict = '脚本与共享 CSS 均生效；若真机仍不美化，问题更可能在移动端酒馆主题覆盖/真实 DOM 与本页结构不同，请发回本报告';
  report.push('结论：' + verdict);
  return report.join('\n');
}
function run() {
  document.getElementById('chat').innerHTML = '';
  if (window.EmoAvatar) {
    window.EmoAvatar.setDebug(false);
    window.EmoAvatar.setCharacters(['弗兰克']);
    window.EmoAvatar.seedAvatar('弗兰克', '微笑', makeImg('微笑'));
    addFloor('<p>{弗兰克(微笑)}他笑了笑，移动端应显示两列美化布局。</p>');
    window.EmoAvatar.scanAll();
  }
  setTimeout(function () {
    document.getElementById('report').textContent = buildReport();
  }, 350);
}
document.getElementById('btn-run').onclick = run;
document.getElementById('btn-copy').onclick = function () {
  var text = document.getElementById('report').textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function () { window.prompt('复制失败，请手动全选：', text); });
  } else {
    window.prompt('请复制报告：', text);
  }
};
document.getElementById('btn-clear').onclick = function () { document.getElementById('report').textContent = ''; };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run, { once: true });
else run();
</script>
</body>
</html>
