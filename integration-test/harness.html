<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>情绪头像 · mock harness</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #181a1f; color: #ddd; font-family: system-ui, "Microsoft YaHei", sans-serif; display: flex; }
  /* 左：假聊天区（模拟酒馆楼层结构） */
  #chat-wrap { flex: 1; padding: 16px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
  .mes { background: #22252c; border-radius: 8px; margin: 10px 0; padding: 10px 14px; }
  .mes .mes_block { display: block; }
  .mes .mes_text { line-height: 1.7; font-size: 16px; white-space: pre-wrap; }
  .mes.is_user .mes_text { color: #9fd0ff; }
  .mes .mes_text p { margin: .4em 0; }
  .mes .mes_text strong { color: #fff; }
  /* 右：控制台 */
  #panel { width: 380px; background: #14161a; border-left: 1px solid #333; padding: 12px; height: 100vh; overflow-y: auto; box-sizing: border-box; font-size: 13px; flex-shrink: 0; }
  #panel h3 { margin: 4px 0 8px; font-size: 15px; }
  #panel h4 { margin: 12px 0 4px; font-size: 13px; color: #8ab; border-bottom: 1px solid #2a2e36; padding-bottom: 2px; }
  #panel button { background: #2d5f8a; color: #fff; border: 0; border-radius: 4px; padding: 4px 10px; margin: 2px; cursor: pointer; font-size: 12px; }
  #panel button:hover { background: #3a78ab; }
  #panel button.warn { background: #8a4a2d; }
  .case { padding: 4px 6px; border-radius: 4px; margin: 2px 0; }
  .case.pass { background: rgba(60,160,80,.25); }
  .case.fail { background: rgba(200,60,60,.35); }
  .case .name { font-weight: 600; }
  .case .detail { color: #bbb; font-size: 11px; white-space: pre-wrap; font-family: Consolas, monospace; }
  #stub-info, #status { font-size: 12px; color: #9a9; font-family: Consolas, monospace; white-space: pre-wrap; }
  #log { font-size: 11px; color: #888; max-height: 200px; overflow: auto; white-space: pre-wrap; font-family: Consolas, monospace; border: 1px solid #2a2e36; padding: 4px; }
  /* 假魔法棒菜单容器 */
  #extensionsMenu { position: fixed; top: 8px; left: 8px; z-index: 5; display: flex; gap: 6px; }
  #extensionsMenu .list-group-item { background: #2d5f8a; color: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; user-select: none; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="extensionsMenu"></div>
<div id="chat-wrap"><div id="chat"></div></div>
<div id="panel">
  <h3>情绪头像 mock harness</h3>
  <div id="status">脚本状态：未加载</div>
  <h4>环境 stub</h4>
  <div id="stub-info"></div>
  <h4>操作</h4>
  <div id="actions"></div>
  <h4>测试用例</h4>
  <button id="run-tests">▶ 运行全部断言</button>
  <div id="cases"></div>
  <h4>日志</h4>
  <div id="log"></div>
</div>

<script>
/* ============================================================
 * 酒馆环境 stub（必须在 emotion-avatar.js 之前定义）
 * ============================================================ */
window.tavern_events = {
  APP_READY: 'app_ready',
  CHAT_CHANGED: 'chat_changed',
  CHARACTER_MESSAGE_RENDERED: 'character_message_rendered',
  USER_MESSAGE_RENDERED: 'user_message_rendered',
  MESSAGE_EDITED: 'message_edited',
  MESSAGE_SWIPED: 'message_swiped',
  MESSAGE_RECEIVED: 'message_received',
  GENERATION_STARTED: 'generation_started',
  GENERATION_ENDED: 'generation_ended',
  GENERATION_STOPPED: 'generation_stopped',
  MORE_MESSAGES_LOADED: 'more_messages_loaded',
  GENERATION_AFTER_COMMANDS: 'generation_after_commands',
};
const __listeners = {};
window.eventOn = function (ev, fn) { (__listeners[ev] = __listeners[ev] || []).push(fn); };
window.__trigger = function (ev) {
  var args = Array.prototype.slice.call(arguments, 1);
  (__listeners[ev] || []).forEach(function (f) { try { f.apply(null, args); } catch (e) { console.error('[stub listener]', ev, e); } });
};

window.__injectCalls = [];
window.injectPrompts = function (prompts, options) {
  window.__injectCalls.push({ prompts: prompts, options: options, t: Date.now() });
  return { uninject: function () { window.__injectCalls.push({ uninjectAll: true, t: Date.now() }); } };
};
window.uninjectPrompts = function (ids) { window.__injectCalls.push({ uninjectIds: ids, t: Date.now() }); };

/* 假聊天数据（模拟 chat[i].mes 原文，用于断言"原文未被写"） */
window.__chat = [];
/* 收集页面错误，供用例断言加载零报错 */
window.__errors = [];
window.addEventListener('error', function (e) { window.__errors.push(e.message); });

/* prompt/confirm 桩：默认取消/确认，用例按需设置 __promptValue / __confirmValue；
   __confirmMessages 记录确认文案，供「长按清缓存」等用例断言弹窗内容 */
window.__promptValue = null;
window.prompt = function () { return window.__promptValue; };
window.__confirmValue = true;
window.__confirmMessages = [];
window.confirm = function (msg) { window.__confirmMessages.push(String(msg)); return window.__confirmValue; };

function __log(msg) {
  var el = document.getElementById('log');
  var time = new Date().toTimeString().slice(0, 8);
  el.textContent = '[' + time + '] ' + msg + '\n' + el.textContent;
}

/* 生成纯色小图 dataURL（种子头像用） */
function __makeImg(hue, label) {
  var c = document.createElement('canvas'); c.width = 96; c.height = 96;
  var ctx = c.getContext('2d');
  ctx.fillStyle = 'hsl(' + hue + ',55%,45%)';
  ctx.fillRect(0, 0, 96, 96);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 48, 48, 88);
  return c.toDataURL('image/png');
}

/* 添加一个假楼层（is_user 区分用户/AI 楼层） */
function __addFloor(text, isUser) {
  var chat = document.getElementById('chat');
  var mes = document.createElement('div');
  mes.className = 'mes' + (isUser ? ' is_user' : '');
  var block = document.createElement('div'); block.className = 'mes_block';
  var mesText = document.createElement('div'); mesText.className = 'mes_text';
  mesText.innerHTML = text;
  block.appendChild(mesText); mes.appendChild(block); chat.appendChild(mes);
  window.__chat.push({ mes: text, is_user: !!isUser });
  __log((isUser ? '[用户] ' : '[AI] ') + '添加楼层 #' + (window.__chat.length - 1));
  return mes;
}

/* 面板按钮注册 */
function __btn(label, fn, warn) {
  var b = document.createElement('button');
  b.textContent = label; b.onclick = fn;
  if (warn) b.className = 'warn';
  document.getElementById('actions').appendChild(b);
  return b;
}

/* ============================================================
 * TTS 桩：假 XHR + 假 fetch + 假 Audio（不触网，只记录请求体供断言）
 * 插件侧合成走 XHR（刻意绕开酒馆里包装 window.fetch 的第三方缓存补丁），
 * 所以桩必须以 XHR 为主；fetch 桩保留给页面其它用途。
 * ============================================================ */
window.__fetchCalls = [];
window.__fetchMode = 'ok';
window.__failHosts = [];
window.__fetchDelayMs = 0;   // 响应延迟：给「取消在途合成」用例留出取消窗口
window.__fetchFailTimes = 0; // 接下来的 N 次请求失败（用于重试用例）
window.__failStatus = 500;   // __fetchMode='fail' 时的 HTTP 状态码（500 可重试 / 401 不可重试）
window.__fakeAudioBytes = [73, 68, 51, 4, 0, 0, 0, 0];
function __audioBlob() { return new Blob([new Uint8Array(window.__fakeAudioBytes)], { type: 'audio/mpeg' }); }
function __abortError() { return new DOMException('The user aborted a request.', 'AbortError'); }
function __encodeText(text) { return new TextEncoder().encode(text).buffer; }
function __b64OfFakeAudio() { return btoa(String.fromCharCode.apply(null, window.__fakeAudioBytes)); }
/* 统一决定这次请求回什么：失败判定 → 按端点给 JSON/NDJSON/音频字节 */
function __buildResult(url) {
  var u = String(url);
  function fail() { return { ok: false, status: window.__failStatus, contentType: 'text/plain', text: 'server error' }; }
  if (window.__fetchFailTimes > 0) { window.__fetchFailTimes--; return fail(); }
  if (window.__fetchMode === 'fail') return fail();
  for (var i = 0; i < window.__failHosts.length; i++) {
    if (u.indexOf(window.__failHosts[i]) !== -1) return fail();
  }
  if (u.indexOf('/t2a_v2') !== -1) {
    return { ok: true, status: 200, contentType: 'application/json', text: JSON.stringify({ base_resp: { status_code: 0 }, data: { audio: '49443304' }, extra_info: {} }) };
  }
  if (u.indexOf('openspeech.bytedance.com') !== -1) {
    return { ok: true, status: 200, contentType: 'application/json', text: '{"code":0,"data":"' + __b64OfFakeAudio() + '"}\n{"code":20000000}\n' };
  }
  if (u.indexOf('/chat/completions') !== -1) {
    return { ok: true, status: 200, contentType: 'application/json', text: JSON.stringify({ choices: [{ finish_reason: 'stop', message: { audio: { data: __b64OfFakeAudio(), format: 'wav' } } }] }) };
  }
  return { ok: true, status: 200, contentType: 'audio/mpeg', bytes: new Uint8Array(window.__fakeAudioBytes) };
}
function __recordCall(u, method, headers, payload) {
  var rec = { url: String(u), method: String(method || 'GET').toUpperCase(), headers: headers || {}, body: null, at: Date.now(), aborted: false };
  if (payload !== undefined && payload !== null) {
    try { rec.body = typeof payload === 'string' ? JSON.parse(payload) : payload; }
    catch (e) { rec.body = payload; }
  }
  window.__fetchCalls.push(rec);
  return rec;
}
function __deliver(fn) {
  if (window.__fetchDelayMs > 0) setTimeout(fn, window.__fetchDelayMs);
  else fn();
}
window.fetch = function (url, options) {
  var opts = options || {};
  var rec = __recordCall(url, opts.method, opts.headers, opts.body);
  // 与真实 fetch 一致地尊重 signal：abort 后 reject(AbortError)，并记录 aborted 供断言
  return new Promise(function (resolve, reject) {
    function deliver() {
      if (rec.aborted) return;
      if (opts.signal && opts.signal.aborted) { rec.aborted = true; reject(__abortError()); return; }
      var r = __buildResult(url);
      resolve({
        ok: r.ok, status: r.status,
        headers: { get: function (k) { return String(k).toLowerCase() === 'content-type' ? r.contentType : (String(k).toLowerCase() === 'content-type' ? r.contentType : null); } },
        blob: function () { return Promise.resolve(r.bytes ? new Blob([r.bytes], { type: r.contentType }) : __audioBlob()); },
        json: function () { return Promise.resolve(r.text ? JSON.parse(r.text) : {}); },
        text: function () { return Promise.resolve(r.text || ''); },
      });
    }
    if (opts.signal) {
      if (opts.signal.aborted) { rec.aborted = true; reject(__abortError()); return; }
      opts.signal.addEventListener('abort', function () { rec.aborted = true; reject(__abortError()); });
    }
    __deliver(deliver);
  });
};
/* 假 XHR：插件合成实际走的通道。接口形状与真实 XMLHttpRequest 的最小可用子集一致 */
window.XMLHttpRequest = function () {
  var self = this;
  var url = '', method = 'GET', reqHeaders = {}, rec = null, aborted = false, sent = false, contentType = '';
  this.readyState = 0; this.status = 0; this.response = null; this.timeout = 0;
  this.onload = null; this.onerror = null; this.ontimeout = null; this.onabort = null;
  this.open = function (m, u) { method = String(m).toUpperCase(); url = String(u); self.readyState = 1; };
  this.setRequestHeader = function (k, v) { reqHeaders[k] = v; };
  this.getResponseHeader = function (k) { return String(k).toLowerCase() === 'content-type' ? (contentType || null) : null; };
  this.getAllResponseHeaders = function () { return ''; };
  this.abort = function () {
    aborted = true;
    if (rec) rec.aborted = true;
    if (self.onabort) self.onabort();
  };
  this.send = function (payload) {
    if (sent) return;
    sent = true;
    rec = __recordCall(url, method, reqHeaders, payload === undefined ? null : payload);
    __deliver(function () {
      if (aborted || rec.aborted) return;
      var r = __buildResult(url);
      self.status = r.status;
      contentType = r.contentType || '';
      self.response = r.bytes ? r.bytes.buffer.slice(0) : __encodeText(r.text || '');
      self.readyState = 4;
      // 与真实 XHR 一致：HTTP 4xx/5xx 也是正常响应（走 onload），只有网络层失败才 onerror
      if (self.onload) self.onload();
    });
  };
};
window.__audioInstances = [];
window.__audioPlayCount = 0;
window.Audio = function () {
  var self = this;
  this.src = ''; this.preload = ''; this.paused = true;
  this.onended = null; this.onerror = null;
  this.play = function () {
    self.paused = false;
    window.__audioPlayCount++;
    window.__lastAudio = self;
    return Promise.resolve();
  };
  this.pause = function () { self.paused = true; };
  window.__audioInstances.push(this);
};
function __lastTtsCall(kind) {
  for (var i = window.__fetchCalls.length - 1; i >= 0; i--) {
    var u = window.__fetchCalls[i].url;
    if (kind === 'edge' && u.indexOf('/tts?') !== -1) return window.__fetchCalls[i];
    if (kind === 'minimax' && u.indexOf('/t2a_v2') !== -1) return window.__fetchCalls[i];
    if (kind === 'doubao' && u.indexOf('openspeech.bytedance.com') !== -1) return window.__fetchCalls[i];
    if (kind === 'mimo' && u.indexOf('/chat/completions') !== -1) return window.__fetchCalls[i];
  }
  return null;
}
function __countTtsCalls(kind) {
  return window.__fetchCalls.filter(function (c) {
    if (kind === 'edge') return c.url.indexOf('/tts?') !== -1;
    if (kind === 'minimax') return c.url.indexOf('/t2a_v2') !== -1;
    if (kind === 'doubao') return c.url.indexOf('openspeech.bytedance.com') !== -1;
    if (kind === 'mimo') return c.url.indexOf('/chat/completions') !== -1;
    return false;
  }).length;
}
function __edgeText(call) {
  if (!call) return '';
  var m = /[?&]t=([^&]*)/.exec(call.url);
  return m ? decodeURIComponent(m[1]) : '';
}
</script>

<script src="../emotion-avatar.js"></script>

<script>
/* ============================================================
 * harness 控制逻辑与测试用例
 * ============================================================ */
var TESTS = [];
function test(name, fn) { TESTS.push({ name: name, run: fn }); }
function assert(cond, detail) { if (!cond) throw new Error(detail || '断言失败'); }
function __wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function __resetChat() {
  document.getElementById('chat').innerHTML = '';
  window.__chat = [];
}
var __seedUrls = {};
function __seedM1() {
  window.EmoAvatar.setCharacters(['弗兰克', '罗兰']);
  window.EmoAvatar.emotions.forEach(function (emo, i) {
    var url = __makeImg(i * 36, '弗兰克·' + emo);
    __seedUrls['弗兰克_' + emo] = url;
    window.EmoAvatar.seedAvatar('弗兰克', emo, url);
  });
  __seedUrls['罗兰_默认'] = __makeImg(200, '罗兰·默认');
  window.EmoAvatar.seedAvatar('罗兰', '默认', __seedUrls['罗兰_默认']);
}

/* ---------- M0 用例：加载与基建 ---------- */
test('M0-1 脚本已加载且暴露版本', function () {
  assert(window.EmoAvatar && typeof window.EmoAvatar === 'object', 'window.EmoAvatar 不存在');
  assert(window.EmoAvatar.version === '0.6.0', '版本不符：' + window.EmoAvatar.version);
});
test('M0-2 样式已注入且尺寸变量生效', function () {
  assert(document.getElementById('eca-styles'), '缺少 #eca-styles');
  assert(document.getElementById('eca-size-style'), '缺少 #eca-size-style');
  var v = getComputedStyle(document.documentElement).getPropertyValue('--eca-size').trim();
  assert(v === '2.5em', '--eca-size = ' + v);
});
test('M0-3 加载过程零报错', function () {
  assert(window.__errors.length === 0, '错误：' + window.__errors.join(' | '));
});

/* ---------- M1 用例：解析与渲染 ---------- */
test('M1-1 完整标签替换为正确头像', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('{弗兰克(大笑)}“看不见的敌人？”他咧嘴一笑。', false);
  window.EmoAvatar.scanAll();
  var img = mes.querySelector('img.eca-avatar');
  assert(img, '未生成头像');
  assert(img.dataset.ecaName === '弗兰克' && img.dataset.ecaEmotion === '大笑', '标记信息错误');
  assert(img.src === __seedUrls['弗兰克_大笑'], '头像图源错误');
  assert(mes.textContent.indexOf('{弗兰克') === -1, '标签文本残留');
  assert(mes.textContent.indexOf('看不见的敌人') !== -1, '正文丢失');
});
test('M1-2 与 markdown 渲染共存，只动标签片段', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('<p><strong>夜色</strong>很浓。{弗兰克(微笑)}“走吧。”</p>', false);
  window.EmoAvatar.scanAll();
  var strong = mes.querySelector('strong');
  assert(strong && strong.textContent === '夜色', 'strong 元素被破坏');
  assert(mes.querySelectorAll('img.eca-avatar').length === 1, '头像数量错误');
});
test('M1-3 未注册角色渲染占位头像', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('{路人甲(微笑)}“让让。”', false);
  window.EmoAvatar.scanAll();
  var ph = mes.querySelector('.eca-placeholder');
  assert(ph, '未生成占位头像');
  assert(ph.title.indexOf('未登记') !== -1, '占位提示错误：' + ph.title);
  assert(mes.textContent.indexOf('{路人甲') === -1, '标签文本残留');
});
test('M1-4 无效情绪词回落默认图', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('{弗兰克(狂喜)}“哈！”', false);
  window.EmoAvatar.scanAll();
  var img = mes.querySelector('img.eca-avatar');
  assert(img, '未生成头像');
  assert(img.src === __seedUrls['弗兰克_默认'], '应回落默认图');
  assert(img.dataset.ecaEmotion === '狂喜', '应保留原始情绪词供排查');
});
test('M1-5 缺图情绪回落默认图', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('{罗兰(杀意)}“别动。”', false);
  window.EmoAvatar.scanAll();
  var img = mes.querySelector('img.eca-avatar');
  assert(img && img.src === __seedUrls['罗兰_默认'], '缺图情绪应回落罗兰默认图');
});
test('M1-6 代码块内标签不替换', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('<pre><code>{弗兰克(大笑)}</code></pre><p>{弗兰克(微笑)}出来吧。</p>', false);
  window.EmoAvatar.scanAll();
  var code = mes.querySelector('code');
  assert(code && code.textContent.indexOf('{弗兰克(大笑)') !== -1, '代码块内文本被改');
  assert(mes.querySelectorAll('img.eca-avatar').length === 1, '代码块外应正常替换');
  assert(mes.querySelector('p img.eca-avatar'), '替换位置错误');
});
test('M1-7 流式：闭合即换、无重复替换', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('', false);
  var target = mes.querySelector('.mes_text');
  var full = '{弗兰克(思考)}“脚印不对。”他蹲下身。{罗兰(默认)}“确实。”';
  target.textContent = full.slice(0, 5); // 标签未闭合
  return __wait(450).then(function () {
    assert(target.querySelectorAll('img.eca-avatar').length === 0, '未闭合标签不应替换');
    target.textContent = full;
    return __wait(450);
  }).then(function () {
    assert(target.querySelectorAll('img.eca-avatar').length === 2, '闭合后应替换出 2 个头像');
  });
});
test('M1-8 楼层重渲染后自动恢复替换', function () {
  __resetChat(); __seedM1();
  var raw = '{弗兰克(惊讶)}“什么声音？！”';
  var mes = __addFloor(raw, false);
  window.EmoAvatar.scanAll();
  assert(mes.querySelector('img.eca-avatar'), '首次替换失败');
  mes.querySelector('.mes_text').innerHTML = raw; // 模拟酒馆重渲染覆盖 DOM
  assert(!mes.querySelector('img.eca-avatar'), '重渲染后应回到原始文本');
  window.__trigger('character_message_rendered', 0);
  return __wait(200).then(function () {
    assert(mes.querySelector('img.eca-avatar'), '事件触发后应恢复替换');
  });
});
test('M1-9 渲染不触碰消息数据源', function () {
  __resetChat(); __seedM1();
  var raw = '{弗兰克(大笑)}“好。”他笑了。';
  __addFloor(raw, false);
  window.EmoAvatar.scanAll();
  assert(window.__chat[0].mes === raw, 'chat[0].mes 被改写');
  assert(document.querySelector('.mes .mes_text img.eca-avatar'), '应已替换出头像');
});
test('M1-10 重扫幂等', function () {
  __resetChat(); __seedM1();
  var mes = __addFloor('{弗兰克(微笑)}开头 {弗兰克(愤怒)}结尾', false);
  window.EmoAvatar.scanAll();
  var n1 = mes.querySelectorAll('img.eca-avatar').length;
  window.EmoAvatar.scanAll();
  window.EmoAvatar.scanAll();
  var n2 = mes.querySelectorAll('img.eca-avatar').length;
  assert(n1 === 2, '首次替换数量错误：' + n1);
  assert(n2 === 2, '重扫产生重复：' + n2);
});

/* ---------- M3 用例：IndexedDB 存储层 ---------- */
function __canvasBlob(hue, label, w, h) {
  w = w || 96; h = h || 96;
  return new Promise(function (resolve) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.fillStyle = 'hsl(' + hue + ',55%,45%)'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, w / 2, h / 2, Math.min(w, h) * 0.9);
    c.toBlob(resolve, 'image/png');
  });
}

function __loadImg(src) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}
function __gridSheet(w, h, cols, rows) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var ctx = c.getContext('2d');
  var cw = w / cols, ch = h / rows, i = 0;
  for (var r = 0; r < rows; r++) for (var col = 0; col < cols; col++) {
    ctx.fillStyle = 'hsl(' + (i * 36) + ',70%,50%)';
    ctx.fillRect(col * cw, r * ch, cw, ch);
    ctx.fillStyle = '#000'; ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), col * cw + cw / 2, r * ch + ch / 2);
    i++;
  }
  return c.toDataURL('image/png');
}

/* ---------- M10 用例：逐头像语音按钮 ---------- */
function __ttsReset() {
  window.__fetchCalls = [];
  window.__audioInstances = [];
  window.__audioPlayCount = 0;
  window.__fetchMode = 'ok';
  window.__failHosts = [];
  window.__fetchDelayMs = 0;
  window.__fetchFailTimes = 0;
  window.__failStatus = 500;
  window.__confirmMessages = [];
  window.EmoAvatar.setTtsEnabled(true);
  // 播放队列会跨用例残留（假 Audio 不会自己播完），关一次语音总开关即全停清队
  window.EmoAvatar.setTtsEnabled(false);
  window.EmoAvatar.setTtsEnabled(true);
  window.EmoAvatar.setTtsConfig({ edge: { proxyUrl: '' } });
}
function __buttons(mes) { return mes.querySelectorAll('.eca-avatar.eca-has-speech'); }
/* 长按手势：派发 pointer 事件（触摸/鼠标同判定），由 __longPress 保证按住超过 LONG_PRESS_MS */
function __pointer(el, type, x, y, pointerType) {
  el.dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: 1, pointerType: pointerType || 'touch',
    button: 0, buttons: 1, clientX: x || 0, clientY: y || 0,
  }));
}
function __longPress(el, ms) {
  __pointer(el, 'pointerdown');
  return new Promise(function (resolve) {
    setTimeout(function () { __pointer(el, 'pointerup'); resolve(); }, ms || 700);
  });
}
/* 真实点击：pointerdown → pointerup → click（程序化 .click() 缺 pointerdown，会被长按回响判定拦下）
   默认鼠标手势；触摸手势用 __touchTap（触摸端双击窗口更宽、单击起播还会压到窗口之后） */
function __tap(el) {
  __pointer(el, 'pointerdown', 0, 0, 'mouse');
  __pointer(el, 'pointerup', 0, 0, 'mouse');
  el.click();
}
function __touchTap(el) {
  __pointer(el, 'pointerdown', 0, 0, 'touch');
  __pointer(el, 'pointerup', 0, 0, 'touch');
  el.click();
}
/* 双击：两次真实点击 + dblclick（浏览器就是 click、click、dblclick 这个顺序） */
function __doubleTap(el) {
  __tap(el);
  __tap(el);
  el.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, cancelable: true, detail: 2 }));
}
function __toasts() {
  return Array.prototype.map.call(document.querySelectorAll('.eca-toast'), function (t) { return t.textContent; }).join(' | ');
}
function __clearToasts() {
  Array.prototype.forEach.call(document.querySelectorAll('.eca-toast'), function (t) { t.remove(); });
}

test('M10-12 自动代理池：探活剔除坏代理，合成失败自动切换下一个', function () {
  __resetChat(); __seedM1(); __ttsReset();
  window.EmoAvatar.setVoiceConfig('弗兰克', { engine: 'edge', voiceId: 'zh-CN-YunxiNeural' });
  var pool = [];
  var firstHost = '';
  return window.EmoAvatar.pingEdgeServers(true).then(function (servers) {
    assert(servers.length >= 2, '全通时应探测到多个代理，实际 ' + servers.length);
    pool = servers;
    firstHost = new URL(pool[0].url).host;
    // 让排名第一的代理在合成阶段失败 → 应自动切到下一个
    window.__failHosts = [firstHost];
    window.__fetchCalls = [];
    var mes = __addFloor('<p>{弗兰克(微笑)}“甲。”</p>', false);
    window.EmoAvatar.scanAll();
    __buttons(mes)[0].click();
    return __wait(200);

    assert(window.__audioPlayCount === 1, '轮换后应成功播放，实际播放次数 ' + window.__audioPlayCount);
    var last = __lastTtsCall('edge');
    assert(last && last.url.indexOf(firstHost) === -1, '应改用其它代理发起合成，实际仍打到 ' + firstHost);
    var remaining = window.EmoAvatar.getEdgeServers();
    assert(remaining.filter(function (s) { return s.url === pool[0].url; }).length === 0, '失败的代理应被摘除');
    // 探活阶段同样只认 HTTP 200
    window.__failHosts = ['64.112.42.45'];
    return window.EmoAvatar.pingEdgeServers(true);
  }).then(function (refreshed) {
    assert(refreshed.filter(function (s) { return s.url.indexOf('64.112.42.45') !== -1; }).length === 0, '探活应剔除返回 500 的代理');
    window.__failHosts = [];
    return window.EmoAvatar.pingEdgeServers(true).then(function () { });
  });
});

    // 模拟酒馆流式重渲染：整楼 DOM 被覆盖回原始文本，头像元素全新
    mesA.querySelector('.mes_text').innerHTML = rawA;
    mesB.querySelector('.mes_text').innerHTML = rawB;
    window.EmoAvatar.scanAll();
    var newA = mesA.querySelector('.eca-avatar');
    var newB = mesB.querySelector('.eca-avatar');
    assert(newA.classList.contains('eca-audio-playing'), '重渲染后甲应恢复播放态：' + newA.className);
    assert(newB.classList.contains('eca-audio-loading'), '重渲染后乙应恢复排队态：' + newB.className);
    __tap(newB);                          // 在新元素上取消排队
    assert(!newB.classList.contains('eca-audio-loading'), '新元素上再点应能取消排队：' + newB.className);
    assert(newA.classList.contains('eca-audio-playing'), '取消乙不该影响在播的甲：' + newA.className);
  });
});

test('M10-42 第二音色缓存优先：生成过第二音色后，单击直接播它（不再回到第一音色）', function () {
  __resetChat(); __seedM1(); __ttsReset(); __clearToasts();
  window.EmoAvatar.setTtsConfig({ edge: { proxyUrl: 'https://example.test/tts', rate: 0, pitch: 0, volume: 100, persist: true }, doubao: { appId: 'app-test', accessKey: 'ak-test', uid: '1222356', persist: true } });
  window.EmoAvatar.setVoiceConfig('弗兰克', { engine: 'edge', voiceId: 'zh-CN-XiaoxiaoNeural', alt: { engine: 'doubao', voiceId: 'zh_male_dayi_saturn_bigtts' } });
  var mes = __addFloor('<p>{弗兰克(微笑)}“音色优先级用例。”</p>', false);
  window.EmoAvatar.scanAll();
  var btn = __buttons(mes)[0];
  var countEngine = function (records, engine) { return records.filter(function (r) { return r.engine === engine; }).length; };
  return window.EmoAvatar.clearTtsCache().then(function () {
    window.EmoAvatar.clearTtsMemory();
    __tap(btn);                           // 还没有第二音色缓存：仍走第一音色
    return __wait(220);
  }).then(function () {
    assert(__countTtsCalls('edge') === 1, '首次单击应走第一音色，实际 ' + __countTtsCalls('edge') + ' 次');
    assert(window.__audioPlayCount === 1, '第一音色应正常播放，实际 ' + window.__audioPlayCount + ' 次');
    window.__lastAudio.onended();
    return __wait(500);
  }).then(function () {
    __doubleTap(btn);                     // 双击：生成第二音色
    return __wait(320);
  }).then(function () {
    assert(__countTtsCalls('doubao') === 1, '双击应用第二音色合成，实际 ' + __countTtsCalls('doubao') + ' 次');
    assert(window.__audioPlayCount === 2, '第二音色应接着播，实际 ' + window.__audioPlayCount + ' 次');
    window.__lastAudio.onended();
    return __wait(500);
  }).then(function () {
    __tap(btn);                           // 关键：第二音色已有缓存，单击应直接播它
    return __wait(220);
  }).then(function () {
    assert(__countTtsCalls('doubao') === 1, '单击应命中第二音色缓存、不再合成，实际 ' + __countTtsCalls('doubao') + ' 次');
    assert(__countTtsCalls('edge') === 1, '单击不该再回头用第一音色，实际 ' + __countTtsCalls('edge') + ' 次');
    assert(window.__audioPlayCount === 3, '第二音色缓存应被直接播放，实际 ' + window.__audioPlayCount + ' 次');
    assert(btn.classList.contains('eca-audio-playing'), '应处于播放态：' + btn.className);
    return window.EmoAvatar.getTtsCache();
  }).then(function (records) {
    assert(countEngine(records, 'edge') === 1 && countEngine(records, 'doubao') === 1,
      '两套音色的缓存都该留着（只比优先级、不删缓存）：edge ' + countEngine(records, 'edge') + ' / doubao ' + countEngine(records, 'doubao'));
    window.__lastAudio.onended();
    __clearToasts();
    return __wait(500);
  }).then(function () {
    return __longPress(btn, 700);         // 长按重生成：应重生成「当前在用」的第二音色，而不是悄悄回到第一音色
  }).then(function () {
    return __wait(340);
  }).then(function () {
    assert(__countTtsCalls('doubao') === 2, '长按应重生成第二音色，实际豆包 ' + __countTtsCalls('doubao') + ' 次');
    assert(__countTtsCalls('edge') === 1, '长按不该回头合成第一音色，实际 edge ' + __countTtsCalls('edge') + ' 次');
    assert(__toasts().indexOf('已重新生成') !== -1, '应回报重生成结果：' + __toasts());
  });
});

test('M10-43 触摸端：自己判定双击就能切第二音色，且第一音色不会抢播', function () {
  __resetChat(); __seedM1(); __ttsReset(); __clearToasts();
  window.EmoAvatar.setTtsConfig({ edge: { proxyUrl: 'https://example.test/tts', rate: 0, pitch: 0, volume: 100, persist: true }, doubao: { appId: 'app-test', accessKey: 'ak-test', uid: '1222356', persist: true } });
  window.EmoAvatar.setVoiceConfig('弗兰克', { engine: 'edge', voiceId: 'zh-CN-XiaoxiaoNeural', alt: { engine: 'doubao', voiceId: 'zh_male_dayi_saturn_bigtts' } });
  var mes = __addFloor('<p>{弗兰克(微笑)}“触屏双击用例。”</p>', false);
  window.EmoAvatar.scanAll();
  var btn = __buttons(mes)[0];
  return window.EmoAvatar.clearTtsCache().then(function () {
    window.EmoAvatar.clearTtsMemory();
    __touchTap(btn);                      // 触摸单击：合成照常立刻开始
    return __wait(200);
  }).then(function () {
    assert(__countTtsCalls('edge') === 1, '单击应立刻开始合成第一音色，实际 ' + __countTtsCalls('edge') + ' 次');
    assert(window.__audioPlayCount === 0, '触摸端单击的声音要等双击窗口过去再出，实际已播 ' + window.__audioPlayCount + ' 次');
    assert(btn.classList.contains('eca-audio-loading'), '等待窗口期间应处于加载态：' + btn.className);
    return __wait(1500);                  // 等过触摸端窗口（600ms，留足定时器被拖慢的余量）
  }).then(function () {
    assert(window.__audioPlayCount === 1, '确认不是双击后应正常出声，实际 ' + window.__audioPlayCount + ' 次');
    window.__lastAudio.onended();
    return __wait(600);
  }).then(function () {
    // 触摸双击：连着两下、且故意不派发 dblclick（移动端常常收不到，必须自己判出来）。
    // 两下不隔定时器等——测试环境的 setTimeout 会被拖慢，间隔一超窗口就变成两次单击了
    __touchTap(btn);
    __touchTap(btn);
    return __wait(500);
  }).then(function () {
    assert(__countTtsCalls('doubao') === 1, '触摸双击应触发第二音色，实际 ' + __countTtsCalls('doubao') + ' 次');
    assert(__countTtsCalls('edge') === 1, '第二下不该再合成第一音色，实际 ' + __countTtsCalls('edge') + ' 次');
    assert(window.__audioPlayCount === 2, '只该出第二音色这一版的声音（第一音色被压住没出声），实际 ' + window.__audioPlayCount + ' 次');
    assert(btn.classList.contains('eca-audio-playing'), '应处于播放态：' + btn.className);
  });
});

/* ---------- 用例运行器（支持异步用例） ---------- */
document.getElementById('run-tests').onclick = function () {
  // 每一轮开跑前把「音频设置」恢复出厂默认：持久化开关/代理会写进 localStorage，
  // 上一轮改动（如 M10-42 打开 Edge 持久化、M10-25 关掉 MiMo 持久化）残留会让 M10-0 的默认值断言随机失败
  window.EmoAvatar.setTtsConfig({ edge: { proxyUrl: '', persist: false }, minimax: { persist: true }, doubao: { persist: true }, mimo: { persist: true } });
  var box = document.getElementById('cases');
  box.innerHTML = '';
  var pass = 0, fail = 0;
  var chain = Promise.resolve();
  TESTS.forEach(function (t) {
    chain = chain.then(function () {
      var div = document.createElement('div');
      div.className = 'case';
      box.appendChild(div);
      return Promise.resolve().then(t.run).then(function (detail) {
        div.classList.add('pass');
        div.innerHTML = '<span class="name">✔ ' + t.name + '</span>' + (detail ? '<div class="detail">' + detail + '</div>' : '');
        pass++;
      }, function (e) {
        div.classList.add('fail');
        div.innerHTML = '<span class="name">✘ ' + t.name + '</span><div class="detail">' + (e.message || e) + '</div>';
        fail++;
      });
    });
  });
  chain.then(function () { __log('断言运行：' + pass + ' 通过 / ' + fail + ' 失败'); refreshPanel(); });
};

    '已注册事件监听：' + evCount + ' 个\n' +
    '监听的事件：' + Object.keys(__listeners).join(', ') + '\n' +
    '注入调用：' + window.__injectCalls.length + ' 次';
}
refreshPanel();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refreshPanel);
